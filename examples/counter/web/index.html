<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared counter · Zig on Freenet</title>
<style>
  :root { color-scheme: light dark; --accent: #f7a41d; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { text-align: center; padding: 2rem; }
  output { display: block; font-size: 4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  button { font: inherit; font-weight: 600; padding: .75rem 1.5rem; border: 0; border-radius: .5rem;
           background: var(--accent); color: #1a1a1a; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; }
  #status { font-size: .875rem; opacity: .7; }
  #status.error { color: #d33; opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>Shared counter</h1>
  <output id="total">–</output>
  <p id="people"></p>
  <button id="click" disabled>+1</button>
  <p id="status">Connecting…</p>
</main>

<script src="freenet.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const setStatus = (text, error = false) => { $("status").textContent = text; $("status").classList.toggle("error", error); };

// A random visitor id, kept across reloads when the browser allows it.
const myId = (() => {
  try { const saved = localStorage.getItem("visitor"); if (saved) return saved; } catch {}
  const id = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("");
  try { localStorage.setItem("visitor", id); } catch {}
  return id;
})();

// "counter-v1\n<id>:<count>\n..." -> Map(id -> count)
const parse = (text) => new Map((text ?? "").split("\n").slice(1).filter(Boolean)
  .map((line) => { const [id, n] = line.split(":"); return [id, Number(n)]; }));

let counts = new Map();
function render() {
  const total = [...counts.values()].reduce((a, b) => a + b, 0);
  $("total").textContent = total;
  $("people").textContent = `${counts.size} ${counts.size === 1 ? "person" : "people"} · you: ${counts.get(myId) ?? 0}`;
}

(async () => {
  try {
    const client = await FreenetClient.connect();
    const counter = client.contract("counter");          // the app's one counter (no parameters)

    let state = await counter.getText();
    if (state === null) {                                 // first visitor ever: create it
      setStatus("Creating the counter…");
      await counter.put("counter-v1\n");
      state = await counter.getText();
    }
    counts = parse(state);
    render();

    await counter.subscribe(async () => {                 // someone clicked somewhere
      counts = parse(await counter.getText());
      render();
    });

    $("click").disabled = false;
    setStatus("Ready");
    $("click").onclick = async () => {
      $("click").disabled = true;
      try {
        await counter.update(`${myId}:${(counts.get(myId) ?? 0) + 1}\n`);
        counts = parse(await counter.getText());
        render();
        setStatus("Ready");
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        $("click").disabled = false;
      }
    };
  } catch (err) {
    setStatus(err.message, true);
  }
})();
</script>
</body>
</html>
